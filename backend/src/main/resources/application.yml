server:
  port: 8090
  address: 127.0.0.1

spring:
  datasource:
    url: jdbc:h2:file:./data/pm;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
      additional-paths: src/main/java,src/main/resources
    livereload:
      enabled: true

pm:
  logs:
    dir: ./logs
    ring-capacity: 2000
  proxy:
    # Rung 1: named <alias>.localhost reverse proxy. Binds 80, falls back to 7777 if taken.
    enabled: true
    port: 80
    fallback-port: 7777
    # Rung 2: separate 0.0.0.0 listener for <alias>.local (phones). Preferred port, scans upward
    # if taken. Kept off 80 because Windows http.sys usually owns the wildcard :80.
    lan-port: 7777
  mdns:
    # Rung 2: announce <alias>.local over mDNS for launches shared on Wi-Fi (reach=WIFI/INTERNET).
    enabled: true
  tunnel:
    # Rung 3: expose a launch on the Internet via a Cloudflare quick tunnel (reach=INTERNET).
    # Only the host needs the cloudflared binary; visitors need only a browser. No account/domain.
    enabled: true
    cloudflared-path: cloudflared
    start-timeout-seconds: 45
  cors:
    allowed-origins: http://localhost:5180,http://127.0.0.1:5180
  shutdown:
    # When PM stops, also kill all child projects. Set to false to leave them running
    # and re-attach to them on the next PM boot via the recorded PID.
    kill-children: true

logging:
  file:
    # PM 后端自身日志落盘，便于 tray(javaw 无控制台)模式下排查启动问题。
    # 放在 logs 子目录，避免与子项目日志(logs/UUID-日期.log)混在一起。
    name: ./logs/backend/pm-backend.log
  logback:
    rollingpolicy:
      file-name-pattern: ./logs/backend/pm-backend.%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
  level:
    root: INFO
    com.pm: DEBUG
    # JmDNS floods WARNs for DNS record type 65 (HTTPS/SVCB) that Apple devices query but it
    # can't parse. Harmless (A-record resolution still works); silence the noise.
    javax.jmdns: ERROR
